# Simulation, rendering and dataset configuration for the physics expert.
# FAR-FIELD, LOW-FRAME-RATE PROFILE ("engine v2"): what fixed wildfire camera
# networks (HPWREN, AlertWildfire) see: smoke, fog and look-alikes kilometres
# away, ONE FRAME PER MINUTE, no lag frames. Same schema as the near-field
# default configs/simulation.yaml; select it with
#   python scripts/generate_dataset.py --config configs/simulation_far.yaml ...
#
# Units are SI unless a key says otherwise. Ranges written [lo, hi] are
# sampled uniformly per simulation (log-uniform where the code says so).
# Scaling from the near profile: cells are 10x larger (50 m) and frames 12x
# further apart (60 s). Everything physical below is chosen for that scale;
# numerical widths inside the code scale with dx and window-relative times
# (onsets, ramps) with the frame interval (src/cfd/scenario_util.py).

seed: 20261019

grid:
  nx: 64
  nz: 64
  domain_width_m: 3200.0    # dx = 50 m; the camera sees the 2.6 km interior (sponges cropped), ~17 m/px at 192 px with zoom
  domain_height_m: 3200.0

time:
  dt_s: 0.5                 # starting timestep (u dt/dx = 0.1 at 10 m/s); halved automatically for the Mach limit
  max_dt_halvings: 3        # 0.5 -> 0.25 -> 0.125 -> 0.0625 s, then the simulation is rejected
  n_frames: 12
  frame_interval_s: 60.0    # one frame per minute: 12 observations span 11 min
  flow_lag_s: null          # no lag frames: optical flow between consecutive observations (flow_mode "consecutive")
  max_offset_s: 10.0        # frame-selection tolerance (camera networks time-stamp to ~seconds, not exactly 60 s)
  precursor_s: 240.0        # source-free spin-up of the ambient flow (a 5 m/s wind crosses ~1.2 km in it)
  spinup_s: [120.0, 900.0]  # random pre-roll before the first frame (2-15 min), the same for every class

lbm:
  sponge_width_cells: 6     # absorbing layer (300 m) at the left, right and top boundaries
  # Sponge rates scaled to the slower dynamics: near field 0.8 1/s against a ~10 s crossing
  # time of its 30 m sponge, here ~60 s across 300 m -> ~0.1 1/s (the same rate x crossing time).
  sponge_rate_s: 0.1
  top_sponge_theta_rate_s: 0.06
  max_lattice_speed: 0.14   # |u| dt/dx; Mach = speed / c_s (c_s = 1/sqrt(3)) -> Ma ~ 0.24
  target_lattice_speed: 0.10
  max_view_density_deviation: 0.05

scalars:
  scheme: muscl

physics:
  g: 9.81
  theta0_k: 288.0
  p0_pa: 101325.0
  rho_air: 1.2
  # A 50 m cell averages the flame zone with entrained air: the mean excess temperature of
  # a source cell is ~5-15 K, not the ~30 K of a 5 m cell. Capping the source heating at
  # 15 K keeps |theta'| / theta0 well inside the Boussinesq check (0.1 -> 28.8 K).
  heat_cap_k: 15.0
  # Texture reset cycle: >= 6 frame intervals so the advected texture stays correlated
  # between consecutive one-minute frames (the blend weight changes by at most
  # pi * 60 / 480 ~ 0.4 between frames); not much longer, or shear (~0.01 1/s over km)
  # stretches the texture coordinates beyond recognition before they reset.
  texture_period_s: 480.0

validation:
  max_mass_residual: 1.0e-6
  max_clipped_fraction: 1.0e-6
  max_compressibility_fraction: 0.05
  max_density_deviation: 0.05
  max_theta_anomaly_frac: 0.1
  max_mach: 0.25
  # Label support at a nominal 1 km line of sight (smoke and fog seen across a valley).
  label_line_of_sight_m: 1000.0
  label_tau_min: 0.1
  label_min_cells: 4
  label_min_frames: 6
  absent_tau_max: 0.05

scenarios:
  # Relative weights; a regime missing from a block (or 0) is never sampled. ridge_cloud
  # (needs a hill / ridge >= min_terrain_height_m and wind) and the nuisance regimes are
  # compatible with only part of the class-independent contexts, hence their larger weights.
  regime_weights:
    smoke_only: {hot_plume: 0.24, smoldering: 0.2, crosswind: 0.2, pulsing: 0.16, advected_smoke: 0.2}
    # Effective fog_only shares: patch / bank / dissipating ~23 % each, radiation ~10 %, ridge_cloud ~10 %
    # (it can take at most the ~14 % of contexts with a tall enough hill and wind), terrain_fog ~4 %
    # (valley + light wind, ~6 % of contexts), steam ~4 % (flat ground).
    fog_only: {radiation_fog: 0.12, advected_fog_bank: 0.16, terrain_fog: 1.0, fog_patch: 0.12, fog_dissipating: 0.12, steam_fog: 0.08, ridge_cloud: 2.0}
    # Effective neither shares: haze ~26 %, dust ~18 %, rain ~17 %, shadow / artefact / cloud 11-15 % each.
    neither: {haze_drift: 0.3, dust_burst: 0.25, illumination_change: 1.0, camera_artifact: 2.0, distant_cloud: 1.6, rain_shaft: 0.2}
  nuisance:
    shadow_prob: 0.28
    strong_artifact_prob: 0.22
    fp_boost_prob: 0.2
    distant_cloud_prob: 0.22
  common:
    wind_speed_ms: [0.0, 12.0]         # at the reference height, all categories; 12-15 m/s is held out
    wind_reference_height_m: 100.0     # first cell centre is 25 m: speeds quoted above the surface layer
    wind_profile_cap: 1.3
    wind_shear_exponent: [0.1, 0.3]
    wind_gust_fraction: [0.0, 0.35]
    wind_gust_period_s: [60.0, 600.0]  # mesoscale fluctuations resolved by one-minute frames
    wind_direction_flip_prob: 0.05
    wind_flip_max_speed_ms: 2.0
    wind_ramp_prob: 0.1
    wind_ramp_factor: [1.3, 2.0]
    # Eddy viscosity of the unresolved boundary-layer turbulence at 50 m resolution
    # (K_m ~ 0.1 u* z ~ 10-50 m^2/s); also keeps the cell Reynolds number u dx / nu
    # comparable to the near profile (~20-60) for the regularized BGK.
    eddy_viscosity_m2s: [15.0, 40.0]
    smagorinsky_cs: [0.1, 0.2]
    scalar_diffusivity_m2s: [3.0, 40.0] # log-uniform; 10x the near range (mixing length scales with dx)
    terrain_prob: 0.5                  # far-field cameras mostly look across hills and valleys
    terrain_kinds: [hill, valley, slope, ridge]
    terrain_height_m: [50.0, 600.0]    # taller terrain is held out (holdout.elevated_source)
    terrain_width_m: {hill: [300.0, 800.0], valley: [500.0, 1100.0], slope: [500.0, 1100.0], ridge: [250.0, 600.0]}
    background_haze_prob: 0.3
    background_haze:                   # faint drifting haze / smog layer in ANY category
      inflow_mg_m3: [0.05, 1.0]
      layer_base_m: [0.0, 1000.0]
      layer_depth_m: [400.0, 2500.0]
      texture_scale_m: [300.0, 1200.0]
      modulation_period_s: [90.0, 480.0]
    theta_ground_k: [272.0, 300.0]
    # Near-neutral (daytime mixed layer) to stable (night, inversion): over a 3.2 km column
    # the near-field range would mean up to 96 K of potential-temperature increase.
    lapse_dtheta_dz: [-0.0005, 0.008]
    # Fire weather is dry: at RH <= 0.45 surface air has a lifting condensation level above
    # ~1.4 km, so flow over 600 m terrain cannot make unlabelled cloud.
    relative_humidity_dry: [0.15, 0.45]
    relative_humidity_fog: [0.6, 0.95]
    spinup_s: [120.0, 900.0]
  smoke:
    source_x_frac: [0.1, 0.9]
    source_width_m: [50.0, 400.0]      # wildfire fronts / burning patches, at least two cells
    # As in the near profile the source starts one cell above the ground: in the wall cell
    # the plume's inflow converges onto the no-slip floor and the discrete divergence there
    # (booked as the compressibility correction) reached 14 % of the smoke budget.
    source_lift_cells: 1
    source_height_m: [0.0, 50.0]       # above local ground
    emission_mg_m3_s: [5.0, 100.0]
    duration_frac: [0.6, 1.0]
    residual_height_m: [400.0, 1600.0] # earlier puff of smoke drifting aloft
    residual_radius_m: [250.0, 600.0]
    residual_offset_m: [-600.0, 600.0]
    # Integrated buoyancy flux per metre of fire line F = g I / (rho c_p T) ~ 2.8e-5 I:
    # 30-300 m^3/s^3 is a 1-11 MW/m flaming front, 0.5-8 a smouldering or mop-up area.
    # (Stronger calm plumes exceed the 5 % compressibility-correction check.)
    hot_plume: {buoyancy_flux_m3s3: [30.0, 300.0], wind_speed_ms: [0.0, 8.0]}
    smoldering: {buoyancy_flux_m3s3: [0.5, 8.0], wind_speed_ms: [0.0, 12.0]}
    crosswind: {buoyancy_flux_m3s3: [20.0, 300.0], wind_speed_ms: [6.0, 15.0]}
    pulsing: {buoyancy_flux_m3s3: [10.0, 200.0], pulse_period_s: [90.0, 480.0], duty_cycle: [0.2, 0.7], wind_speed_ms: [0.0, 12.0]}
    advected_smoke: {layer_base_m: [0.0, 1200.0], layer_depth_m: [200.0, 1500.0], inflow_mg_m3: [0.5, 15.0], intermittency: [0.3, 0.8], residual_warmth_k: [0.1, 0.5], wind_speed_ms: [2.0, 15.0], modulation_period_s: [60.0, 300.0]}
  fog:
    lwc_g_m3: [0.05, 0.4]              # fog and stratus
    fog_top_m: [100.0, 800.0]          # fog / low-stratus tops
    rh_outside: [0.9, 0.98]
    inversion_offset_m: 100.0          # capping inversion above the fog top (2 cells)
    radiation_fog: {wind_speed_ms: [0.0, 5.0], fog_top_m: [100.0, 400.0], inversion_dtheta_dz: [0.004, 0.02], surface_cooling_k_s: [0.00002, 0.0002]}
    advected_fog_bank: {wind_speed_ms: [1.5, 15.0], front_x_frac: [0.1, 0.6], modulation_period_s: [120.0, 480.0], inversion_dtheta_dz: [0.0, 0.01]}
    # Valley fog fills the valley below the ridges (top = max(fog_top_m, fill_frac x valley depth)).
    terrain_fog: {wind_speed_ms: [0.0, 6.0], fog_top_m: [50.0, 200.0], cold_layer_k: [0.5, 3.0], cold_layer_depth_m: [60.0, 150.0], fill_frac: [0.5, 1.1], inversion_dtheta_dz: [0.004, 0.02], surface_cooling_k_s: [0.00003, 0.0002]}
    fog_patch: {wind_speed_ms: [0.0, 12.0], patch_radius_m: [250.0, 700.0], ambient_rh: [0.9, 0.98], center_height_m: [0.0, 900.0], inflow_depth_m: [200.0, 1000.0], inversion_dtheta_dz: [0.0, 0.01]}
    # Surface heating per 50 m cell: 0.0003-0.003 K/s is a 20-200 W/m^2 sunrise flux.
    fog_dissipating: {wind_speed_ms: [0.0, 15.0], dry_inflow_rh: [0.4, 0.85], surface_warming_k_s: [0.0003, 0.003], inversion_dtheta_dz: [0.002, 0.015]}
    steam_fog: {wind_speed_ms: [0.0, 8.0], surface_excess_k: [8.0, 15.0], ambient_rh: [0.85, 0.98], strip_width_m: [200.0, 1000.0], exchange_time_s: [20.0, 60.0]}   # lake / river steam, needs flat ground
    # Orographic cap cloud: inflow humid enough that air lifted by lcl_frac x ridge height
    # saturates; near-neutral to weakly stable (lapse capped) so the flow goes over the ridge.
    ridge_cloud: {wind_speed_ms: [4.0, 15.0], min_terrain_height_m: 150.0, lcl_frac: [0.3, 0.7], moist_top_frac: [1.5, 3.0], rh_above: [0.3, 0.7], max_lapse_dtheta_dz: 0.004}
  neither:
    haze_drift: {inflow_mg_m3: [0.2, 4.0], layer_base_m: [0.0, 1000.0], layer_depth_m: [400.0, 2500.0], texture_scale_m: [300.0, 1200.0], modulation_period_s: [90.0, 480.0]}
    # Dust from a vehicle on a dirt road or a gust over bare ground, lasting minutes.
    dust_burst: {emission_mg_m3_s: [10.0, 120.0], duration_s: [30.0, 240.0], settling_ms: [0.1, 0.6], wind_speed_ms: [2.0, 15.0], source_width_m: [50.0, 200.0], vehicle_speed_ms: [5.0, 20.0], flicker_period_s: [10.0, 60.0]}
    # Precipitation curtain from a cloud base 1.2-2.6 km up, drifting with the wind there;
    # drops fall at 3-8 m/s (several minutes to the ground) and may evaporate on the way (virga).
    # shaft_mg_m3: in-shaft concentration (tracer equivalent), 0.1-1.5 -> optical depth 0.4-6
    # over 1 km. onset_s: literal seconds relative to the first frame (-6 to +2 min).
    rain_shaft: {wind_speed_ms: [0.0, 15.0], cloud_base_m: [1200.0, 2600.0], shaft_width_m: [300.0, 1200.0], fall_speed_ms: [3.0, 8.0], shaft_mg_m3: [0.1, 1.5], evaporation_rate_s: [0.0, 0.003], intermittency: [0.0, 0.6], modulation_period_s: [120.0, 600.0], onset_s: [-360.0, 120.0], cloud_drift_factor: [0.4, 1.0]}

holdout:
  fast_wind: {wind_speed_ms: [12.0, 15.0]}
  elevated_source: {terrain_height_m: [700.0, 1000.0], width_m: [350.0, 700.0], center_frac: [0.3, 0.7]}

render:
  native_size: [192, 192]
  view_margin_cells: 6
  zoom: [0.6, 1.0]                       # 1.6-2.6 km of the interior: ~8-14 m per native pixel
  foreground_band: [0.0, 0.2]
  line_of_sight_m: [300.0, 3000.0]       # smoke columns and fog banks are hundreds of m to km deep
  smoke_mass_extinction_m2_mg: 0.0076
  tracer_mass_extinction_m2_mg: 0.004
  aerosol_brightness: [0.35, 0.95]
  peak_opacity: [0.08, 0.9]
  background_haze_opacity: [0.02, 0.2]
  texture:
    gain: [0.3, 0.9]
    shading: [0.1, 0.3]
    wavelengths_m: [30.0, 400.0]         # sub-grid puffs and wisps resolvable at ~17 m/px
    sgs_gain: [0.5, 1.5]
  background:
    procedural_prob: 0.85
    sky_brightness: [0.45, 0.95]
    ground_brightness: [0.05, 0.45]       # calibrated: FIgLib scenes span a wide gray range
  global_haze: [0.0, 0.3]               # aerial perspective over kilometres (calibrated to FIgLib contrast)
  contrast: [0.9, 2.0]                   # calibrated: FIgLib train cameras, median (P95-P5)/255 = 0.71
  brightness_offset: [-0.3, 0.12]       # calibrated: includes dusk-dark FIgLib frames
  noise_sigma: [0.004, 0.035]
  jpeg_quality: [35, 95]
  jpeg_prob: 0.8                         # camera-network archives are JPEG
  exposure_flicker: [0.0, 0.03]          # auto exposure between one-minute frames (FIgLib frames are steady)
  camera_shake_px: [0.0, 0.3]            # calibrated: rigid camera-network mounts (FIgLib median 0.06, P95 ~0.5 px per minute)
  camera_shake_tau_s: [1.0, 30.0]        # mast sway / PTZ re-pointing: largely decorrelated 60 s apart
  camera_rotation_deg: [0.0, 0.1]
  strong_artifact:
    camera_shake_px: [2.5, 6.0]
    zoom_jitter: [0.01, 0.04]
    exposure_flicker: [0.06, 0.15]
  shadow:
    strength: [0.15, 0.45]
    speed_frac_s: [0.0005, 0.004]        # cloud shadows at 3-10 m/s across a ~2.6 km view
  distant_cloud:
    brightness: [0.75, 1.0]
    size_frac: [0.1, 0.35]
    speed_frac_s: [0.0001, 0.001]
  occlusion_prob: 0.3
  occlusion_area_frac: [0.03, 0.2]
  label_min_opacity: 0.08
  label_min_contrast: 0.025
  label_min_frames: 4
  absent_max_opacity: 0.03
  masks:
    source_probs: {degraded: 0.5, bbox: 0.2, detector: 0.3}
    threshold_contrast: [0.02, 0.08]
    morph_px: [-2, 2]
    boundary_noise: [0.0, 0.15]
    drop_component_prob: 0.1
    false_positive_prob: 0.15
    false_positive_prob_boost: 0.5
    frame_dropout_prob: 0.05
    min_area_frac: 0.001

robustness:
  nominal: {}
  occlusion_heavy: {occlusion_prob: 1.0, occlusion_area_frac: [0.3, 0.45]}
  shake_heavy: {camera_shake_px: [4.0, 7.0], camera_rotation_deg: [0.8, 1.5]}
  render_shift: {noise_sigma: [0.05, 0.08], jpeg_quality: [12, 25], jpeg_prob: 1.0, contrast: [0.35, 0.55], global_haze: [0.45, 0.6]}
  zoom_out: {zoom: [0.35, 0.55]}
  detector_masks: {masks: {source_probs: {detector: 1.0}}}
  bbox_masks: {masks: {source_probs: {bbox: 1.0}}}
  sgs_off: {texture: {sgs_gain: [0.0, 0.0]}}   # no subgrid texture motion (merges into render.texture)

dataset:
  n_per_category: 50
  split_fractions: {train: 0.6, val_select: 0.1, val_calib: 0.15, test_iid: 0.15}
  ood_per_category: 25
  variants: {train: 3, val_select: 3, val_calib: 3, test_iid: 2, test_ood: 2}
  max_attempts: 6
  max_variant_retries: 4
  store_render_diagnostics: subset
  store_diagnostics: true
